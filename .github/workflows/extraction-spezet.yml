name: Extraction Spézet (ponctuelle)
on:
  push:
    branches: [extraction-spezet]
    paths: ['.github/scripts/extraction_spezet.py', '.github/workflows/extraction-spezet.yml']
permissions:
  contents: write
jobs:
  extraire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/extraction_spezet.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extraction_spezet/ && git commit -m "Extraction Spézet" && git push origin extraction-spezet
