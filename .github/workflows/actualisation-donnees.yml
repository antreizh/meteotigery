name: Actualisation des relevés

on:
  schedule:
    - cron: '23 7 * * *'
    - cron: '23 16 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/scripts/actualiser_donnees.py', '.github/workflows/actualisation-donnees.yml']

permissions:
  contents: write

concurrency:
  group: releves
  cancel-in-progress: false

jobs:
  actualiser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Télécharger Météo-France et Hub'Eau
        run: python3 .github/scripts/actualiser_donnees.py
      - name: Enregistrer les relevés
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "Aucun changement"; exit 0; fi
          git commit -m "Relevés du $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin main
